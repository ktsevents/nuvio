name: Sync from Nuvio upstream

# Keeps this mirror in sync with NuvioPlugin/All-in-One-Nuvio so the Tv24h apps
# (which hot-load providers from this repo at runtime) always get the latest
# provider code WITHOUT any app rebuild. Runs daily + can be triggered manually.

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nuvio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4

      - name: Fetch upstream providers
        run: |
          set -e
          rm -rf _src
          git clone --depth 1 https://github.com/NuvioPlugin/All-in-One-Nuvio.git _src
          rm -rf providers
          mkdir -p providers
          cp -a _src/providers/. providers/
          if [ -f _src/manifest.json ]; then cp _src/manifest.json manifest.json; fi
          rm -rf _src
          # record sync time + upstream commit for traceability
          printf '{"synced_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > sync-info.json

      - name: Build single bundle (apps fetch ONE file, not 61)
        run: |
          python3 - <<'PY'
          import os, json
          d = 'providers'; out = {}
          LIMIT = 200 * 1024   # skip oversized bundles that won't run in QuickJS (vixsrc/peachify/anime-sama)
          active = None
          if os.path.exists('nuvio_active.json'):
              try:
                  active = set(json.load(open('nuvio_active.json', encoding='utf-8')))
              except Exception:
                  active = None
          for f in sorted(os.listdir(d)):
              if not f.endswith('.js'):
                  continue
              name = f[:-3]
              if active is not None and name not in active:   # only curated providers
                  continue
              p = os.path.join(d, f)
              if os.path.getsize(p) > LIMIT:
                  continue
              with open(p, encoding='utf-8') as fh:
                  out[name] = fh.read()
          with open('nuvio_bundle.json', 'w', encoding='utf-8') as fh:
              json.dump(out, fh, ensure_ascii=False)
          print('bundle providers:', len(out), '(active list:', 'yes' if active is not None else 'no)')
          PY

      - name: Commit & push if changed
        run: |
          git config user.name "nuvio-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "sync: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
